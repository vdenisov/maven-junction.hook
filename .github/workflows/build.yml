name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.name }} path)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            junction-path: ''
          - name: custom
            junction-path: 'C:\custom dir\maven'
    defaults:
      run:
        shell: pwsh
    env:
      JUNCTION_PATH: ${{ matrix.junction-path }}
      MOVED_JUNCTION_PATH: 'C:\moved dir\maven'
      # Any version older than the latest Maven package.
      OLD_MAVEN_VERSION: '3.9.9'
    steps:
      - uses: actions/checkout@v7

      - name: Build package
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            .\build.ps1 -Version ($env:GITHUB_REF_NAME -replace '^v', '')
          } else {
            .\build.ps1
          }
          Get-ChildItem dist

      # --force: the runner image may already have a newer Maven.
      - name: Install older Maven
        run: |
          choco install maven --version $env:OLD_MAVEN_VERSION -y --force --allow-downgrade --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install maven failed ($LASTEXITCODE)" }

      - name: Install hook package and verify junction to installed Maven
        run: |
          $ErrorActionPreference = 'Stop'
          $chocoArgs = @('install', 'maven-junction.hook', '--source', "$PWD\dist", '-y', '--no-progress')
          if ($env:JUNCTION_PATH) {
            $chocoArgs += @('--params', "/JunctionPath:'$env:JUNCTION_PATH'")
          }
          choco @chocoArgs
          if ($LASTEXITCODE -ne 0) { throw "choco install maven-junction.hook failed ($LASTEXITCODE)" }

          if ($env:JUNCTION_PATH) {
            $saved = [Environment]::GetEnvironmentVariable('MAVEN_JUNCTION_PATH', 'Machine')
            if ($saved -ne $env:JUNCTION_PATH) { throw "MAVEN_JUNCTION_PATH is '$saved', expected '$env:JUNCTION_PATH'" }
          }

          $junctionPath = if ($env:JUNCTION_PATH) { $env:JUNCTION_PATH }
                          elseif ($env:ChocolateyToolsLocation) { Join-Path $env:ChocolateyToolsLocation 'maven' }
                          else { "$env:SystemDrive\tools\maven" }
          "EXPECTED_JUNCTION=$junctionPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

          $target = .github\scripts\assert-junction.ps1 -Path $junctionPath
          if ((Split-Path $target -Leaf) -ne "apache-maven-$env:OLD_MAVEN_VERSION") {
            throw "Expected junction to apache-maven-$env:OLD_MAVEN_VERSION, got $target"
          }

      - name: Upgrade Maven and verify junction is retargeted
        run: |
          $ErrorActionPreference = 'Stop'
          choco upgrade maven -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco upgrade maven failed ($LASTEXITCODE)" }

          $target = .github\scripts\assert-junction.ps1 -Path $env:EXPECTED_JUNCTION
          if ((Split-Path $target -Leaf) -eq "apache-maven-$env:OLD_MAVEN_VERSION") {
            throw "Junction still points to $target after the upgrade"
          }

      - name: Change junction location and verify junction is moved
        run: |
          $ErrorActionPreference = 'Stop'
          choco install maven-junction.hook --source "$PWD\dist" -y --force --no-progress --params "/JunctionPath:'$env:MOVED_JUNCTION_PATH'"
          if ($LASTEXITCODE -ne 0) { throw "choco install maven-junction.hook --force failed ($LASTEXITCODE)" }

          if (Get-Item $env:EXPECTED_JUNCTION -Force -ErrorAction SilentlyContinue) {
            throw "$env:EXPECTED_JUNCTION still exists after changing the junction location"
          }
          .github\scripts\assert-junction.ps1 -Path $env:MOVED_JUNCTION_PATH | Out-Null
          "EXPECTED_JUNCTION=$env:MOVED_JUNCTION_PATH" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Uninstall Maven and verify junction is removed
        run: |
          $ErrorActionPreference = 'Stop'
          choco uninstall maven -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco uninstall maven failed ($LASTEXITCODE)" }

          if (Get-Item $env:EXPECTED_JUNCTION -Force -ErrorAction SilentlyContinue) {
            throw "$env:EXPECTED_JUNCTION still exists after uninstalling Maven"
          }
          Write-Host 'Junction removed.'

      - name: Uninstall hook package and verify setting is removed
        run: |
          choco uninstall maven-junction.hook -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco uninstall maven-junction.hook failed ($LASTEXITCODE)" }

          if ([Environment]::GetEnvironmentVariable('MAVEN_JUNCTION_PATH', 'Machine')) {
            throw 'MAVEN_JUNCTION_PATH still set after uninstalling the hook package'
          }

      - uses: actions/upload-artifact@v7
        if: matrix.name == 'default'
        with:
          name: nupkg
          path: dist/*.nupkg

  release:
    if: github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nupkg
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.nupkg --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
